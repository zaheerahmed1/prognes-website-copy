<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" fill="#0A0A0A"/>
  <!-- Accent dot grid — abstract mark -->
  <rect x="6" y="6" width="8" height="2" fill="#D6FF3F"/>
  <rect x="6" y="10" width="5" height="2" fill="#D6FF3F" opacity="0.6"/>
  <rect x="18" y="6" width="8" height="2" fill="#F5F5F5" opacity="0.4"/>
  <rect x="18" y="10" width="8" height="2" fill="#F5F5F5" opacity="0.4"/>
  <rect x="18" y="14" width="8" height="2" fill="#F5F5F5" opacity="0.4"/>
  <!-- Vertical accent line -->
  <rect x="6" y="15" width="2" height="11" fill="#D6FF3F" opacity="0.8"/>
  <!-- Mark accent -->
  <rect x="10" y="19" width="4" height="2" fill="#D6FF3F" opacity="0.4"/>
  <rect x="10" y="23" width="6" height="2" fill="#D6FF3F" opacity="0.2"/>
</svg>
